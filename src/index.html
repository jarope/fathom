<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fathom</title>
    <link rel="stylesheet" href="vendor/xterm/xterm.css" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div class="panel">
      <div class="sidebar-wrap">
        <div class="side-top" data-tauri-drag-region></div>
        <nav id="sidebar" class="sidebar" aria-label="Places"></nav>
      </div>
      <div class="main">
      <div class="header">
        <div class="loc"><span class="loc-name" id="locName">Fathom</span></div>
        <div class="header-right">
          <!-- View mode of the active pane (segmented) -->
          <div class="cap segmented" role="group" aria-label="View">
            <button id="vmGrid" type="button" title="Grid (⌥⌘1)" aria-label="Grid view">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="5.5" height="5.5" rx="1.3"/><rect x="11.5" y="3" width="5.5" height="5.5" rx="1.3"/><rect x="3" y="11.5" width="5.5" height="5.5" rx="1.3"/><rect x="11.5" y="11.5" width="5.5" height="5.5" rx="1.3"/></svg>
            </button>
            <button id="vmDetails" type="button" title="Details (⌥⌘2)" aria-label="Details view">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 5h1M7 5h10M3 10h1M7 10h10M3 15h1M7 15h10"/></svg>
            </button>
            <button id="vmColumns" type="button" title="Columns (⌥⌘3)" aria-label="Columns view">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.75" y="4" width="14.5" height="12" rx="2"/><path d="M7.6 4v12M12.4 4v12"/></svg>
            </button>
            <button id="vmUsage" type="button" title="Usage — what's taking the space (⌥⌘4)" aria-label="Usage view">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="3" y="3.5" width="14" height="3" rx="1"/><rect x="3" y="8.5" width="9" height="3" rx="1"/><rect x="3" y="13.5" width="5" height="3" rx="1"/></svg>
            </button>
          </div>
          <!-- Layout: single vs twin pane (segmented — one is always on) -->
          <div class="cap segmented" role="group" aria-label="Layout">
            <button id="viewSingle" type="button" title="Single pane (⌘\)" aria-label="Single pane">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.75" y="4" width="14.5" height="12" rx="2"/></svg>
            </button>
            <button id="viewTwin" type="button" title="Twin pane (⌘\)" aria-label="Twin pane">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.75" y="4" width="14.5" height="12" rx="2"/><path d="M10 4v12"/></svg>
            </button>
          </div>
          <!-- Panels & visibility: independent toggles -->
          <div class="cap" role="group" aria-label="Show">
            <button id="shelfToggle" type="button" title="Folder shelf — sub-folders in one row above the files (⇧⌘F)" aria-label="Folder shelf">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3.5" width="4" height="4" rx="1"/><rect x="8" y="3.5" width="4" height="4" rx="1"/><rect x="13" y="3.5" width="4" height="4" rx="1"/><path d="M3 11.5h14M3 15h14"/></svg>
            </button>
            <button id="sidebarToggle" type="button" title="Places sidebar (⌃⌘S / F9)" aria-label="Places sidebar">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.75" y="4" width="14.5" height="12" rx="2"/><path d="M7.5 4v12"/></svg>
            </button>
            <button id="dockToggle" type="button" title="Information panel (F11 / ⌘P)" aria-label="Information panel">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="2.75" y="4" width="14.5" height="12" rx="2"/><circle cx="7.5" cy="8.5" r="1.4"/><path d="M3 14l4.5-3.5 3 2.5 2.5-2 4 3"/></svg>
            </button>
            <button id="hiddenToggle" type="button" title="Show hidden files (⇧⌘.)" aria-label="Show hidden files">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 10s3-5.5 8-5.5S18 10 18 10s-3 5.5-8 5.5S2 10 2 10z"/><circle cx="10" cy="10" r="2.4"/></svg>
            </button>
          </div>
          <div class="cap" role="group" aria-label="Appearance">
            <button id="zoomBtn" type="button" aria-label="Text and icon size" title="Zoom — ⌥⌘+ / ⌥⌘− / ⌘0">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 15.5L6 6l3.5 9.5M3.6 12.5h4.8"/><path d="M11.5 15.5l3-8 3 8M12.3 13.3h4.4"/></svg>
            </button>
            <button id="prefsBtn" type="button" aria-label="Preferences" title="Preferences (⌘,)">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3.5 6h8M15.5 6h1M3.5 14h1M8.5 14h8"/><circle cx="13.5" cy="6" r="2"/><circle cx="6.5" cy="14" r="2"/></svg>
            </button>
            <button id="theme" type="button" aria-label="Toggle theme" title="Toggle light / dark">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="6.5"/><path d="M10 3.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg>
            </button>
          </div>
        </div>
      </div>

      <div id="tabbar" class="tabbar"></div>

      <div class="body">
        <div id="panes" class="panes single"></div>
        <aside id="infoPanel" class="ipanel" hidden aria-label="Information"><div class="ip-grip" title="Drag to resize"></div><div class="ip-body"></div></aside>
      </div>
      <section id="termPanel" class="termp" hidden aria-label="Terminal"><div class="term-grip" title="Drag to resize"></div><button class="term-close" type="button" title="Hide terminal (⌃` or F4) — the shell keeps running" aria-label="Hide terminal"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 3l6 6M9 3l-6 6"/></svg></button><div class="term-host"></div></section>

      </div>
    </div>

    <div id="ctx" class="ctx"></div>
    <div id="jobs" class="jobs" aria-live="polite"></div>

    <div id="preview">
      <div class="pv-box">
        <img class="pv-img" id="pvImg" alt="" />
        <div class="pv-cap">
          <span class="nm" id="pvName"></span>
          <span class="dim" id="pvDim"></span>
          <span class="hint">Space / Esc to close · ↑ ↓ to browse</span>
        </div>
      </div>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
