[package]
name = "fathom"
version = "0.12.0"
description = "Fathom — a lean twin-pane file manager for macOS. The daily essentials, done the way Linux managers do them."
authors = ["Jason Peel"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "fathom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Recursive directory walk + glob/wildcard matching for search.
walkdir = "2"
globset = "0.4"

# Move-to-Bin that uses the real OS trash (recoverable), never a hard delete.
trash = "5"

# Image thumbnails/previews — decode + downscale to a small data URI so the
# webview shows a preview without loading multi-MB screenshots whole.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
base64 = "0.22"

# statvfs() for the free-space readout in the status bar.
libc = "0.2"
notify = "8"
tauri-plugin-window-state = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Native pasteboard (file URLs) so ⌘C / ⌘V interoperate with Finder.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem"] }
